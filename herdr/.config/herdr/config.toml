onboarding = false
[theme]
name = "catppuccin-latte"

[remote]
manage_ssh_config = true

[experimental]
kitty_graphics = true

[keys]
new_worktree = ""
open_worktree = "prefix+shift+o"
remove_worktree = "prefix+shift+k"

[[keys.command]]
key = "prefix+shift+g"
type = "plugin_action"
command = "theo.worktree.new"
description = "Worktree: new theo/<name>"
